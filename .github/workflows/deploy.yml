name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master # 배포 대상 브랜치 확인

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ----------------------------------------------------
      # [핵심] 기밀 파일 2개를 지정된 경로에 통째로 생성하기
      # ----------------------------------------------------
      - name: Restore Secret Files
        run: |
          # 폴더가 없을 경우를 대비해 미리 생성
          mkdir -p frontend/lib/config
          mkdir -p frontend/web
          
          # 시크릿 변수 내용을 파일로 저장
          cat << 'EOF' > frontend/lib/config/secrets.dart
          ${{ secrets.SECRETS_DART }}
          EOF

          cat << 'EOF' > frontend/web/firebase-messaging-sw.js
          ${{ secrets.FIREBASE_SW_JS }}
          EOF

      # 3. 플러터 패키지 설치 및 웹 빌드 (frontend 폴더 기준 실행)
      - name: Install Dependencies & Build Web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --base-href "/"

      # 4. 커스텀 도메인을 위한 CNAME 파일 생성
      - name: Create CNAME file
        run: echo "${{ secrets.CUSTOM_DOMAIN }}" > frontend/build/web/CNAME

      # 5. gh-pages 브랜치로 배포
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/build/web # 빌드 결과물 경로 확인
          branch: release
          token: ${{ secrets.GITHUB_TOKEN }}
